    <script>
      // In the AI Studio Cloud Run environment, HMR is disabled by design.
      // Mock Vite's HMR WebSocket so doomed handshakes over the Cloud Run proxy do not produce false console errors.
      (function() {
        if (typeof window === 'undefined') return;

        if (window.WebSocket) {
          var NativeWebSocket = window.WebSocket;
          function ViteSafeWebSocket(url, protocols) {
            var isHmr = false;
            if (protocols === 'vite-hmr' || (Array.isArray(protocols) && protocols.indexOf('vite-hmr') !== -1)) {
              isHmr = true;
            } else if (typeof url === 'string' && (url.indexOf('vite-hmr') !== -1 || url.indexOf('/@vite/') !== -1)) {
              isHmr = true;
            }

            if (isHmr) {
              var bus = new EventTarget();
              var mock = {
                url: url,
                readyState: 1, // WebSocket.OPEN
                protocol: 'vite-hmr',
                extensions: '',
                bufferedAmount: 0,
                binaryType: 'blob',
                send: function() {},
                close: function() {},
                addEventListener: bus.addEventListener.bind(bus),
                removeEventListener: bus.removeEventListener.bind(bus),
                dispatchEvent: bus.dispatchEvent.bind(bus),
              };
              ['open', 'message', 'error', 'close'].forEach(function(ev) {
                Object.defineProperty(mock, 'on' + ev, {
                  get: function() { return this['_on' + ev] || null; },
                  set: function(fn) {
                    if (this['_on' + ev]) bus.removeEventListener(ev, this['_on' + ev]);
                    this['_on' + ev] = fn;
                    if (fn) bus.addEventListener(ev, fn);
                  }
                });
              });
              return mock;
            }
            return new NativeWebSocket(url, protocols);
          }
          ViteSafeWebSocket.prototype = NativeWebSocket.prototype;
          ViteSafeWebSocket.CONNECTING = NativeWebSocket.CONNECTING;
          ViteSafeWebSocket.OPEN = NativeWebSocket.OPEN;
          ViteSafeWebSocket.CLOSING = NativeWebSocket.CLOSING;
          ViteSafeWebSocket.CLOSED = NativeWebSocket.CLOSED;
          window.WebSocket = ViteSafeWebSocket;
        }

        window.addEventListener('error', function(event) {
          var msg = event && (event.message || (event.error && event.error.message)) || '';
          if (
            msg.indexOf('WebSocket closed without opened') !== -1 ||
            (event.filename && event.filename.indexOf('@vite/client') !== -1)
          ) {
            event.preventDefault();
            event.stopImmediatePropagation();
            return true;
          }
        }, true);

        window.addEventListener('unhandledrejection', function(event) {
          var reason = event && event.reason;
          var msg = String((reason && reason.message) || reason || '');
          if (msg.indexOf('WebSocket') !== -1) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        }, true);
      })();
    </script>
